<!doctype html>
<html lang="de">
<heade>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>webhome</title>
    <link rel="stylesheet" href="stylesheet.css"/>
    <script src="jquery.js"></script>
    <script src="sitewebshot.js" defer></script>
</heade>
<body>
    <main class="topbar">
        <div id="titel">
            <h2>entry</h2>
        </div>
        <div class="links-topbar">
            <h2></h2>
        </div>
    </main >
    <main class="app">
        <form id="snapshot-form">
        <div class="controls">
            <input
            id="url"
            type="url"
            placeholder="site preview"
            value=""
            onclick="changeValue()"
            required
            >
            <script>function changeValue(){document.getElementById("url").setAttribute("value", "https://");}</script>
            <button type="submit">go</button>
<!--            <button id="download-button" type="button" disabled>save</button>-->
        </div>
    </form>
        <p id="status" role="status"></p>
    <div id="snapshots" aria-live="polite"></div>
      <p class="placeholder"></p>
    </div>
    </main>
</body>
</html>
